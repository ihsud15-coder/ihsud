<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 가계부 달력</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e9ecef;
      --primary-color: #4c6ef5;
      --danger-color: #e03131;
      --danger-bg: #fff5f5;
      --income-color: #2b8a3e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .month-nav { display: flex; align-items: center; gap: 15px; }
    .month-nav button { background: none; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .month-nav h2 { font-size: 22px; font-weight: 700; }
    .budget-info { font-size: 15px; font-weight: 600; }

    /* Calendar Grid */
    .calendar { background: var(--card-bg); border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 600; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
    .weekdays div:first-child { color: var(--danger-color); }
    .weekdays div:last-child { color: var(--primary-color); }

    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border-color); border: 1px solid var(--border-color); margin-top: 10px; }
    .day-cell { background: #fff; min-height: 100px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: background 0.2s; }
    .day-cell:hover { background: #f1f3f5; }
    .day-cell.other-month { opacity: 0.3; background: #fafafa; }
    .day-number { font-weight: 600; font-size: 13px; }

    /* Highlights & Emoticons */
    .day-cell.high-expense { background-color: var(--danger-bg); }
    .day-cell.high-expense .day-total { color: var(--danger-color); font-weight: 700; }
    .day-total { font-size: 12px; text-align: right; margin-bottom: 4px; color: #495057; }
    .zero-expense-flag { text-align: center; font-size: 20px; margin: auto 0; }

    .item-list { font-size: 11px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; max-height: 55px; }
    .item-chip { background: #e7f5ff; color: #1971c2; padding: 2px 4px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Form & List Section */
    .section-card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .form-group input, .form-group select, .form-group button { padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; }
    .form-group input[type="text"] { flex: 2; }
    .form-group input[type="number"] { flex: 1; }
    .btn-primary { background: var(--primary-color); color: white; border: none !important; cursor: pointer; font-weight: 600; }
    .btn-danger { background: var(--danger-color); color: white; border: none !important; cursor: pointer; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--border-color); text-align: left; }
    th { background: #f8f9fa; font-weight: 600; }
    .action-btns { display: flex; gap: 5px; }
    .action-btns button { padding: 4px 8px; font-size: 12px; border-radius: 4px; border: 1px solid var(--border-color); cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">◀ 이전달</button>
      <h2 id="current-month-display"></h2>
      <button onclick="changeMonth(1)">다음달 ▶</button>
      <button onclick="resetToCurrentMonth()">오늘 달로</button>
    </div>
    <div class="budget-info">
      이번 달 총 지출: <span id="monthly-total" style="color: var(--danger-color); font-weight: 700;">0원</span>
    </div>
  </header>

  <!-- Calendar Grid -->
  <div class="calendar">
    <div class="weekdays">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div id="calendar-days" class="days"></div>
  </div>

  <!-- Entry Input / Edit Form -->
  <div class="section-card">
    <h3 id="form-title">지출 내역 추가 / 수정</h3>
    <form id="expense-form" onsubmit="handleFormSubmit(event)">
      <input type="hidden" id="edit-id">
      <div class="form-group">
        <input type="date" id="input-date" required>
        <input type="text" id="input-title" placeholder="사용 내역 (예: 한식뷔페)" required>
        <input type="number" id="input-amount" placeholder="금액 (원)" required min="1">
        <select id="input-category">
          <option value="식비">식비</option>
          <option value="카페간식">카페간식</option>
          <option value="생활">생활</option>
          <option value="교통">교통</option>
          <option value="문화여가">문화여가</option>
          <option value="고정지출">고정지출</option>
        </select>
        <button type="submit" class="btn-primary" id="submit-btn">저장하기</button>
        <button type="button" onclick="resetForm()" id="cancel-btn" style="display:none;">취소</button>
      </div>
    </form>
  </div>

  <!-- Expense List -->
  <div class="section-card">
    <h3>이달의 지출 상세 목록</h3>
    <table>
      <thead>
        <tr>
          <th>날짜</th>
          <th>내역</th>
          <th>카테고리</th>
          <th>금액</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="expense-list-body"></tbody>
    </table>
  </div>
</div>

<script>
  // 초기 데이터 및 기준 시점 설정 (현재 접속 시점 기준 자동 설정)
  let currentDate = new Date(); 
  let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];

  window.onload = () => {
    initDatePicker();
    renderCalendar();
  };

  function initDatePicker() {
    const todayStr = currentDate.toISOString().split('T')[0];
    document.getElementById('input-date').value = todayStr;
  }

  function resetToCurrentMonth() {
    currentDate = new Date();
    renderCalendar();
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('current-month-display').innerText = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const prevLastDate = new Date(year, month, 0).getDate();

    const calendarDays = document.getElementById('calendar-days');
    calendarDays.innerHTML = '';

    // 이전 달 날짜 채우기
    for (let i = firstDay - 1; i >= 0; i--) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'day-cell other-month';
      dayDiv.innerHTML = `<span class="day-number">${prevLastDate - i}</span>`;
      calendarDays.appendChild(dayDiv);
    }

    let monthlySum = 0;

    // 현재 달 날짜 생성
    for (let day = 1; day <= lastDate; day++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dayExpenses = expenses.filter(e => e.date === dateStr);
      const dayTotal = dayExpenses.reduce((sum, e) => sum + Number(e.amount), 0);
      monthlySum += dayTotal;

      const dayDiv = document.createElement('div');
      dayDiv.className = 'day-cell';
      
      // [기능 2] 4만 원 이상 지출일 빨간색 하이라이트
      if (dayTotal >= 40000) {
        dayDiv.classList.add('high-expense');
      }

      dayDiv.onclick = () => selectDateForAdd(dateStr);

      let contentHtml = `<div class="day-number">${day}</div>`;

      // [기능 5] 생략 없이 원본 금액 전체 표시 (3자리 콤마 처리)
      if (dayTotal > 0) {
        contentHtml += `<div class="day-total">-${dayTotal.toLocaleString()}원</div>`;
        contentHtml += `<div class="item-list">`;
        dayExpenses.forEach(exp => {
          contentHtml += `<div class="item-chip" onclick="event.stopPropagation(); editExpense(${exp.id})">${exp.title}</div>`;
        });
        contentHtml += `</div>`;
      } else {
        // [기능 4] 무지출일 축제 폭죽 이모티콘 표기
        contentHtml += `<div class="zero-expense-flag" title="무지출 성공!">🎉</div>`;
      }

      dayDiv.innerHTML = contentHtml;
      calendarDays.appendChild(dayDiv);
    }

    // 다음 달 날짜 채우기
    const totalCells = calendarDays.children.length;
    const remainingCells = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= remainingCells; i++) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'day-cell other-month';
      dayDiv.innerHTML = `<span class="day-number">${i}</span>`;
      calendarDays.appendChild(dayDiv);
    }

    document.getElementById('monthly-total').innerText = `${monthlySum.toLocaleString()}원`;
    renderExpenseList();
  }

  function renderExpenseList() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const listBody = document.getElementById('expense-list-body');
    listBody.innerHTML = '';

    const currentMonthExpenses = expenses
      .filter(e => {
        const d = new Date(e.date);
        return d.getFullYear() === year && d.getMonth() === month;
      })
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    currentMonthExpenses.forEach(exp => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${exp.date}</td>
        <td><strong>${exp.title}</strong></td>
        <td>${exp.category}</td>
        <td>${Number(exp.amount).toLocaleString()}원</td>
        <td class="action-btns">
          <button onclick="editExpense(${exp.id})">수정</button>
          <button class="btn-danger" onclick="deleteExpense(${exp.id})">삭제</button>
        </td>
      `;
      listBody.appendChild(tr);
    });
  }

  // [기능 3] 입력 및 수정 처리
  function handleFormSubmit(event) {
    event.preventDefault();

    const editId = document.getElementById('edit-id').value;
    const date = document.getElementById('input-date').value;
    const title = document.getElementById('input-title').value;
    const amount = Number(document.getElementById('input-amount').value);
    const category = document.getElementById('input-category').value;

    if (editId) {
      // 기존 내역 수정
      const idx = expenses.findIndex(e => e.id == editId);
      if (idx !== -1) {
        expenses[idx] = { id: Number(editId), date, title, amount, category };
      }
    } else {
      // 새 내역 추가
      const newExpense = {
        id: Date.now(),
        date,
        title,
        amount,
        category
      };
      expenses.push(newExpense);
    }

    saveAndRefresh();
    resetForm();
  }

  function editExpense(id) {
    const exp = expenses.find(e => e.id === id);
    if (!exp) return;

    document.getElementById('edit-id').value = exp.id;
    document.getElementById('input-date').value = exp.date;
    document.getElementById('input-title').value = exp.title;
    document.getElementById('input-amount').value = exp.amount;
    document.getElementById('input-category').value = exp.category;

    document.getElementById('form-title').innerText = '지출 내역 수정하기';
    document.getElementById('submit-btn').innerText = '수정 완료';
    document.getElementById('cancel-btn').style.display = 'inline-block';
  }

  function deleteExpense(id) {
    if (confirm('이 내역을 삭제하시겠습니까?')) {
      expenses = expenses.filter(e => e.id !== id);
      saveAndRefresh();
    }
  }

  function selectDateForAdd(dateStr) {
    document.getElementById('input-date').value = dateStr;
    document.getElementById('input-title').focus();
  }

  function resetForm() {
    document.getElementById('edit-id').value = '';
    document.getElementById('expense-form').reset();
    initDatePicker();

    document.getElementById('form-title').innerText = '지출 내역 추가 / 수정';
    document.getElementById('submit-btn').innerText = '저장하기';
    document.getElementById('cancel-btn').style.display = 'none';
  }

  function saveAndRefresh() {
    localStorage.setItem('my_expenses', JSON.stringify(expenses));
    renderCalendar();
  }
</script>

</body>
</html>
